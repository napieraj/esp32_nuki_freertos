esphome:
  name: nuki-uart-bridge-r4a

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

ethernet:
  type: W5500
  clk_pin: GPIO12
  mosi_pin: GPIO11
  miso_pin: GPIO13
  cs_pin: GPIO10
  interrupt_pin: GPIO9
  reset_pin: GPIO14

api:
  custom_services: true
  homeassistant_services: true

logger:
  baud_rate: 0

external_components:
  - source:
      type: local
      path: /home/user/esp32_nuki_freertos/components

uart:
  id: nuki_uart
  tx_pin: GPIO17
  rx_pin: GPIO18
  baud_rate: 921600
  rx_buffer_size: 1024

lock:
  - platform: nuki_uart_bridge
    id: front_door
    name: "Front Door Nuki"
    uart_id: nuki_uart
    security_pin: "065432"
    device_type: auto
    state_poll_interval: 30s
    event: "nuki_event"
    secure_link: auto
    event_log_count: 5
    connected:
      name: "Front Door Nuki Connected"
    last_unlock_user:
      name: "Front Door Nuki Last Unlock User"
    last_lock_action:
      name: "Front Door Nuki Last Lock Action"
    last_lock_action_trigger:
      name: "Front Door Nuki Last Lock Action Trigger"
    door_sensor:
      name: "Front Door"
    door_sensor_state:
      name: "Front Door Sensor State"
    tamper:
      name: "Front Door Sensor Tamper"
    on_event_log:
      - logger.log:
          format: "log #%u type 0x%02X auth %u '%s'"
          args: ["entry.index", "entry.type", "entry.auth_id", "entry.name"]
    on_door_state:
      - logger.log:
          format: "door state 0x%02X"
          args: ["door_state"]

button:
  - platform: template
    name: "Front Door Nuki Keypad List"
    on_press:
      - lambda: id(front_door).print_keypad_entries();
  - platform: template
    name: "Front Door Nuki Fetch Logs"
    on_press:
      - lambda: id(front_door).request_event_logs(10);
