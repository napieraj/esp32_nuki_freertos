esphome:
  name: nuki-uart-bridge-r4a
  friendly_name: "Front Door Nuki"

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

ethernet:
  type: W5500
  clk_pin: GPIO12
  mosi_pin: GPIO11
  miso_pin: GPIO13
  cs_pin: GPIO10
  interrupt_pin: GPIO9
  reset_pin: GPIO14

api:
  custom_services: true
  homeassistant_services: true

logger:
  baud_rate: 0

time:
  - platform: sntp
    id: sntp_time
    timezone: Europe/Berlin

external_components:
  - source:
      type: local
      path: components

uart:
  id: nuki_uart
  tx_pin: GPIO17
  rx_pin: GPIO18
  baud_rate: 921600
  rx_buffer_size: 1024

lock:
  - platform: nuki_uart_bridge
    id: front_door
    name: "Front Door Nuki"
    uart_id: nuki_uart
    security_pin: "065432"
    device_type: auto
    time_id: sntp_time            # daily Update Time 0x0021 (+ after every time sync)
    state_poll_interval: 30s
    pairing_mode_timeout: 300s
    allowed_actions: [unlock, lock, unlatch, lock_n_go, lock_n_go_unlatch]
    action_suffix: "Home Assistant"  # <= 20 bytes; empty = the friendly name
    event: "nuki_event"
    secure_link: auto
    event_log_count: 5
    connected:
      name: "Connected"
    paired:
      name: "Paired"
    rssi:
      name: "RSSI"
    diagnostics:
      name: "Bridge Diagnostics"
    pin_status:
      name: "PIN Status"
    nuki_state:
      name: "Nuki State"
    firmware_version:
      name: "Firmware Version"
    hardware_version:
      name: "Hardware Version"
    lock_name:
      name: "Lock Name"
    nuki_id:
      name: "Nuki ID"
    keypad_paired:
      name: "Keypad Paired"
    battery_level:
      name: "Battery"
    battery_critical:
      name: "Battery Critical"
    battery_charging:
      name: "Battery Charging"
      disabled_by_default: true
    keypad_battery_critical:
      name: "Keypad Battery Critical"
    door_sensor_battery_critical:
      name: "Door Sensor Battery Critical"
    last_unlock_user:
      name: "Last Unlock User"
    last_lock_action:
      name: "Last Lock Action"
    last_lock_action_trigger:
      name: "Last Lock Action Trigger"
    last_lock_action_completion_status:
      name: "Last Lock Action Completion Status"
    night_mode:
      name: "Night Mode"
    door_sensor:
      name: "Front Door"
    door_sensor_state:
      name: "Door Sensor State"
    door_security_state:
      name: "Door Security State"
    tamper:
      name: "Door Sensor Tamper"
    pairing_mode:
      name: "Pairing Mode"
    unpair:
      name: "Unpair"
    request_calibration:
      name: "Calibrate"
    reboot:
      name: "Reboot Lock"
    on_pairing_complete:
      - logger.log:
          format: "paired, auth id %u"
          args: ["auth_id"]
    on_pairing_mode_on:
      - logger.log: "pairing mode on"
    on_pairing_mode_off:
      - logger.log: "pairing mode off"
    on_event_log:
      - logger.log:
          format: "log #%u type 0x%02X auth %u '%s'"
          args: ["entry.index", "entry.type", "entry.auth_id", "entry.name"]
    on_door_state:
      - logger.log:
          format: "door state 0x%02X"
          args: ["door_state"]

button:
  - platform: template
    name: "Keypad List"
    on_press:
      - lambda: id(front_door).print_keypad_entries();
  - platform: template
    name: "Fetch Logs"
    on_press:
      - lambda: id(front_door).request_event_logs(10);
  - platform: template
    name: "Lock 'n' Go"
    on_press:
      - nuki_uart_bridge.lock_n_go:
          id: front_door
          unlatch: false
          suffix: "ESPHome button"
  - platform: template
    name: "Verify PIN"
    on_press:
      - nuki_uart_bridge.verify_pin: front_door
  - platform: template
    name: "Update Lock Time"
    on_press:
      - nuki_uart_bridge.update_time: front_door
  - platform: template
    name: "Set PIN Override 123456"
    on_press:
      - nuki_uart_bridge.set_security_pin:
          id: front_door
          security_pin: 123456
  - platform: template
    name: "Pair (5 min window)"
    on_press:
      - if:
          condition:
            not:
              nuki_uart_bridge.paired: front_door
          then:
            - nuki_uart_bridge.set_pairing_mode:
                id: front_door
                pairing_mode: true
          else:
            - logger.log: "already paired"
  - platform: template
    name: "Fob Action 1"
    on_press:
      - nuki_uart_bridge.lock_action:
          id: front_door
          action: fob_1
